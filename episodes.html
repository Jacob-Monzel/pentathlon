<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pentathlon">
<meta name="theme-color" content="#EEF2F7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Pentathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <div class="dayhead">
    <a href="index.html" class="back">&lsaquo;</a>
    <div class="dayttl">Flares</div>
  </div>
  <div id="epHead"></div>
  <div class="epform">
    <input type="date" id="epDate">
    <select id="epWhat">
      <option value="">what flared…</option>
    </select>
    <input type="text" id="epCtx" placeholder="trigger / context (optional)">
    <button id="epAdd" class="primary">Add</button>
  </div>
  <div id="epList"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=202608110052"></script>
<script>
  boot(async () => {
  epDate.value = todayISO();
  epWhat.innerHTML = `<option value="">what flared\u2026</option>` +
    FLARES.map(f => `<option>${f}</option>`).join('');

  function render() {
    const fs = flareStats();
    epHead.innerHTML = fs.daysSince === null
      ? `<div class="rm"><div class="rm-h"><span class="rm-n">Flare-free</span><span class="rm-v">\u2014</span></div>
           <div class="rm-meta">nothing logged \u2014 good. The gap getting longer is the win.</div></div>`
      : `<div class="rm"><div class="rm-h"><span class="rm-n">Days since last flare</span><span class="rm-v">${fs.daysSince}</span></div>
           <div class="rm-meta">${fs.last.what} \u00b7 ${prettyDate(fs.last.date)}${fs.last30 ? ` \u00b7 ${fs.last30} in the last 30 days` : ''}</div></div>`;

    if (!fs.all.length) {
      epList.innerHTML = '<div class="empty">Nothing logged \u2014 good.<br>The gap between episodes getting longer is the win.</div>';
      return;
    }
    epList.innerHTML = fs.all.map(e =>
      `<div class="ep">
         <div class="gap">${e.gap === null ? 'first' : e.gap}<span>${e.gap === null ? '' : 'days'}</span></div>
         <div class="epb"><b>${e.what}</b><div class="d">${prettyDate(e.date)}</div>${e.ctx?`<div class="c">${e.ctx}</div>`:''}</div>
       </div>`).join('');
  }

  epAdd.onclick = () => {
    const w = epWhat.value;
    if (!w) { epWhat.focus(); return; }
    Store.update(s => { s.episodes = s.episodes || []; s.episodes.push({ id: Date.now(), date: epDate.value || todayISO(), what: w, ctx: epCtx.value.trim() }); });
    epWhat.value = ''; epCtx.value = '';
    render();
  };

  render();
  });
</script>
</body>
</html>
