<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pentathlon">
<meta name="theme-color" content="#EEF2F7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Pentathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2026.08.12-8">
</head>
<body>
<div class="page">
  <div class="dayhead">
    <a href="index.html" class="back">&lsaquo;</a>
    <div class="dayttl">Progress</div>
  </div>
  <div id="bwCard"></div>
  <div class="section-label">This week · training load</div>
  <div id="loadCard"></div>
  <div class="section-label">Load trend · 8 weeks</div>
  <div id="trendCard"></div>
  <details class="fold">
    <summary>Muscle volume · logged sets</summary>
    <div id="volCard"></div>
  </details>
  <div class="section-label">Estimated 1RM</div>
  <div class="liftpickwrap"><select id="liftPick"></select></div>
  <div id="oneRM"></div>
  <div class="section-label">Recent PRs</div>
  <div id="prCard"></div>
  <div class="section-label">Recent sessions</div>
  <div id="histCard"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=2026.08.12-8"></script>
<script>
  boot(async () => {
  function spark(vals) {
    if (vals.length < 2) return '<span class="nospark">need 2+ sessions</span>';
    const w = 130, h = 34, mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1;
    const pts = vals.map((v, i) => `${((i/(vals.length-1))*w).toFixed(1)},${(h-((v-mn)/rng)*h).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  const bwl = bodyweightLog();
  if (bwl.length) {
    const vals = bwl.map(x => x.bw), cur = vals[vals.length-1];
    bwCard.innerHTML = `<div class="rm bw-card"><div class="rm-h"><span class="rm-n">Bodyweight</span><span class="rm-v">${cur}</span></div><div class="rm-spark">${spark(vals)}</div><div class="rm-meta">${vals.length} entries</div></div>`;
  } else {
    bwCard.innerHTML = `<div class="rm bw-card"><div class="rm-h"><span class="rm-n">Bodyweight</span><span class="rm-v off">—</span></div><div class="rm-meta">enter it at the top of a workout to start tracking</div></div>`;
  }

  const SPORTS = [['lift','\u{1F3CB}\uFE0F','Lifting'],['run','\u{1F3C3}','Running'],['swim','\u{1F3CA}','Swimming'],
                  ['fence','\u{1F93A}','Fencing'],['ninja','\u{1F9D7}','Ninja / OCR'],['athletic','\u26A1','Athletic']];
  const wk = weekLoad(weekDays(0).map(d => d.iso));
  const prev = weekLoad(weekDays(-1).map(d => d.iso));
  if (!wk.total) {
    loadCard.innerHTML = `<div class="rm"><div class="rm-h"><span class="rm-n">Weekly load</span><span class="rm-v off">\u2014</span></div>
      <div class="rm-meta">rate a session (RPE \u00d7 minutes) to start tracking load across all five sports</div></div>`;
  } else {
    const rows = SPORTS.filter(([k]) => wk.totals[k] > 0);
    const mx = Math.max(...rows.map(([k]) => wk.totals[k]));
    const delta = prev.total ? Math.round((wk.total - prev.total) / prev.total * 100) : null;
    const mono = wk.monotony;
    const monoNote = mono >= 2 ? 'every day looks the same \u2014 consider more hard/easy contrast'
                   : mono > 0 ? 'good hard/easy contrast' : '';
    loadCard.innerHTML =
      `<div class="rm"><div class="rm-h"><span class="rm-n">Weekly load <em>AU</em></span><span class="rm-v">${wk.total}</span></div>
         <div class="rm-meta">${delta === null ? 'first tracked week' : `${delta >= 0 ? '+' : ''}${delta}% vs last week`}${mono ? ` \u00b7 monotony ${mono.toFixed(1)}` : ''}</div>
         <div class="vol">${rows.map(([k,e,n]) =>
           `<div class="vrow"><span class="vg">${e} ${n}</span><span class="vbarwrap"><span class="vbar" style="width:${Math.round(wk.totals[k]/mx*100)}%"></span></span><span class="vn">${wk.totals[k]}</span></div>`).join('')}</div>
         ${monoNote ? `<div class="rm-meta">${monoNote}</div>` : ''}</div>`;
  }

  // ---- load trend, last 8 weeks ----
  const trend = loadTrend(8), tvals = trend.map(t => t.total);
  if (!tvals.some(v => v)) {
    trendCard.innerHTML = `<div class="rm"><div class="rm-meta">no rated sessions yet \u2014 the trend fills in as you rate</div></div>`;
  } else {
    const mxT = Math.max(...tvals) || 1;
    trendCard.innerHTML =
      `<div class="rm"><div class="bars">${trend.map(t => {
        const h = Math.round((t.total / mxT) * 100);
        const lbl = t.offset === 0 ? 'now' : t.offset;
        return `<div class="barcol"><div class="barwrap"><div class="bar${t.offset===0?' cur':''}" style="height:${Math.max(h,2)}%"></div></div><span>${lbl}</span></div>`;
      }).join('')}</div>
      <div class="rm-meta">weekly load (AU) \u00b7 peak ${Math.max(...tvals)}</div></div>`;
  }

  // ---- muscle volume from LOGGED sets (collapsed by default) ----
  {
    const wkIsos = weekDays(0).map(d => d.iso);
    const isos4 = [];
    for (let o = -3; o <= 0; o++) weekDays(o).forEach(d => isos4.push(d.iso));
    const wk = loggedVolume(wkIsos), mo = loggedVolume(isos4);
    if (!mo.length) {
      volCard.innerHTML = `<div class="rm"><div class="rm-meta">no lifts logged yet</div></div>`;
    } else {
      const mx = Math.max(...mo.map(v => v.sets));
      const wkMap = Object.fromEntries(wk.map(v => [v.group, v.sets]));
      volCard.innerHTML =
        `<div class="rm"><div class="rm-meta">effective sets \u00b7 secondary counted at \u00bd \u00b7 last 4 weeks (this week)</div>
          <div class="vol">${mo.map(v =>
            `<div class="vrow"><span class="vg">${v.group}</span>
               <span class="vbarwrap"><span class="vbar" style="width:${Math.round(v.sets/mx*100)}%"></span></span>
               <span class="vn">${v.sets}<em>${wkMap[v.group] ? ' \u00b7 ' + wkMap[v.group] : ''}</em></span></div>`).join('')}</div></div>`;
    }
  }

  // ---- estimated 1RM, any lift you've logged ----
  const lifts = loggedLifts();
  if (!lifts.length) {
    document.querySelector('.liftpickwrap').hidden = true;
    oneRM.innerHTML = `<div class="rm"><div class="rm-meta">no lifts logged yet</div></div>`;
  } else {
    const pref = PROGRESS_LIFTS.map(x => x.k).find(k => lifts.some(l => l.k === k)) || lifts[0].k;
    liftPick.innerHTML = lifts.map(l => `<option value="${l.k}"${l.k===pref?' selected':''}>${l.n} (${l.count})</option>`).join('');
    const drawLift = k => {
      const series = e1rmSeries(k), vals = series.map(x => x.v);
      if (!vals.length) { oneRM.innerHTML = `<div class="rm"><div class="rm-meta">no sets logged</div></div>`; return; }
      const cur = vals[vals.length-1], best = Math.max(...vals), basis = series[series.length-1].basis;
      const tag = k === 'pullup' ? ` <em>${basis === 'total' ? 'bw + added' : 'added'}</em>` : '';
      oneRM.innerHTML = `<div class="rm"><div class="rm-h"><span class="rm-n">${exName(k)}${tag}</span><span class="rm-v">${cur}</span></div>
        <div class="rm-spark">${spark(vals)}</div>
        <div class="rm-meta">est. 1RM \u00b7 best ${best} \u00b7 ${vals.length} sessions</div></div>`;
    };
    liftPick.onchange = () => drawLift(liftPick.value);
    drawLift(pref);
  }

  // ---- recent PRs ----
  const prs = recentPRs(6);
  prCard.innerHTML = prs.length
    ? `<div class="actlist">${prs.map(p =>
        `<div class="actrow"><div class="act-emoji">\u{1F3C6}</div><div class="act-body"><b>${p.n}</b>
          <span>est. 1RM ${p.v} \u00b7 up from ${p.prev} \u00b7 ${prettyDate(p.date)}</span></div></div>`).join('')}</div>`
    : `<div class="rm"><div class="rm-meta">PRs show up here once you beat a previous best</div></div>`;

  // ---- recent sessions ----
  const hist = trainingHistory(12);
  histCard.innerHTML = hist.length
    ? `<div class="actlist">${hist.map(h => {
        const bits = [h.detail];
        if (h.srpe) bits.push(`RPE ${h.srpe}`);
        if (h.minutes) bits.push(`${h.minutes} min`);
        if (h.load) bits.push(`<b>${h.load} AU</b>`);
        if (h.deload) bits.push('deload');
        else if (h.readiness && h.readiness !== 'normal') bits.push(READINESS[h.readiness] ? READINESS[h.readiness].label.toLowerCase() : h.readiness);
        return `<div class="actrow"><div class="act-emoji">${h.emoji}</div><div class="act-body"><b>${h.label}</b>
          <span>${prettyDate(h.date)} \u00b7 ${bits.filter(Boolean).join(' \u00b7 ')}</span></div></div>`;
      }).join('')}</div>`
    : `<div class="rm"><div class="rm-meta">nothing logged yet</div></div>`;
  });
</script>
</body>
</html>
