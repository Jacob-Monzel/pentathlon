<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pentathlon">
<meta name="theme-color" content="#EEF2F7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Pentathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2026.08.12-10">
</head>
<body>
<div class="page home">
  <div class="home-brand">Pentathlon</div>
  <div class="wknav">
    <button id="prev" aria-label="previous week">&lsaquo;</button>
    <div class="wklabel" id="wklabel"></div>
    <button id="next" aria-label="next week">&rsaquo;</button>
  </div>
  <div id="resume"></div>
  <div id="weighin"></div>
  <div class="goals" id="goals"></div>
  <div class="wk" id="wk"></div>
  <div class="links">
    <a href="plan.html">Plan</a>
    <a href="progress.html">Progress</a>
    <a href="episodes.html">Episodes</a>
    <a href="data.html">Backup</a>
    <a href="#" id="out">Log out</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=2026.08.12-10"></script>
<script>
  boot(async () => {
  let offset = 0;
  const today = todayISO();

  // resume banner — an in-progress workout is autosaved; surface it
  const di = draftInfo();
  if (di) {
    resume.innerHTML =
      `<a class="resume" href="workout.html?day=${di.day}&date=${di.date}">
         <div class="resume-body"><b>Resume ${di.label}</b><span>${di.sets} set${di.sets===1?'':'s'} saved · ${prettyDate(di.date)}</span></div>
         <span class="resume-caret">›</span></a>`;
  }

  // morning weigh-in — same conditions daily; disappears once today's is in.
  // "Skip" is session-scoped on purpose: it clears when the app is closed (so it
  // asks again next open) and never syncs, so skipping here doesn't skip elsewhere.
  let memSkip = false;
  const SKIP_KEY = 'weighin_skip_' + today;
  const isSkipped = () => { try { return sessionStorage.getItem(SKIP_KEY) === '1'; } catch (e) { return memSkip; } };
  const setSkipped = v => { memSkip = v; try { v ? sessionStorage.setItem(SKIP_KEY,'1') : sessionStorage.removeItem(SKIP_KEY); } catch (e) {} };

  function renderWeighIn() {
    const todayW = weightForDate(today);
    if (todayW) {
      const log = bodyweightLog(), prev = log.length > 1 ? log[log.length-2].bw : null;
      const dlt = prev !== null ? +(todayW.bw - prev).toFixed(1) : null;
      weighin.innerHTML =
        `<div class="weighed"><span>\u2713 Weighed in \u00b7 <b>${todayW.bw}</b> lbs${dlt !== null ? ` \u00b7 ${dlt >= 0 ? '+' : ''}${dlt} vs last` : ''}</span>
           <button id="wEdit">edit</button></div>`;
      wEdit.onclick = () => renderForm(todayW.bw);
      return;
    }
    if (isSkipped()) {
      weighin.innerHTML = `<button class="weighmini" id="wUndo">+ log this morning\u2019s weigh-in</button>`;
      wUndo.onclick = () => { setSkipped(false); renderForm(''); };
      return;
    }
    renderForm('');
  }
  function renderForm(val) {
    weighin.innerHTML =
      `<div class="weighcard">
         <div class="weighq"><b>Morning weigh-in</b><span>same time, same conditions</span>
           <button class="weighx" id="wSkip" aria-label="skip for now">\u2715</button></div>
         <div class="weighin-row">
           <input id="wIn" inputmode="decimal" placeholder="${latestBodyweight() || '—'}" value="${val}">
           <span class="bw-unit">lbs</span>
           <button class="weighsave" id="wSave">Save</button>
         </div>
       </div>`;
    wIn.focus();
    wSkip.onclick = () => { setSkipped(true); renderWeighIn(); };
    wSave.onclick = () => {
      const v = parseFloat(wIn.value);
      if (!isFinite(v) || v <= 0) { wIn.focus(); return; }
      logWeight(today, v);
      setSkipped(false);
      renderWeighIn(); render();
    };
    wIn.onkeydown = e => { if (e.key === 'Enter') wSave.click(); };
  }
  // The weigh-in is a nice-to-have; it must never be able to take down the
  // calendar. If app.js is stale or cached, skip it rather than throwing.
  try {
    if (typeof weightForDate === 'function') renderWeighIn();
    else console.warn('weigh-in needs a newer app.js');
  } catch (e) {
    console.warn('weigh-in unavailable:', e);
    weighin.innerHTML = '';
  }

  const chip = (cls, txt) => `<span class="chip ${cls}">${txt}</span>`;
  function chipsFor(iso) {
    let out = '';
    sessionsOn(iso).forEach(s => {
      if (ATHLETIC_DAYS.includes(s.day)) out += chip('c-athletic', '\u26A1 A' + s.day.slice(1));
      else out += chip('c-lift', '\u{1F3CB}\uFE0F ' + (PROGRAM[s.day] ? PROGRAM[s.day].label.replace('Workout ','W') : 'Lift'));
    });
    activitiesOn(iso).forEach(a => {
      const e = ACT[a.type] ? ACT[a.type].emoji : '\u2022';
      let t;
      if (a.type === 'run' || a.type === 'swim') { const tot = actTotals(a).dist; t = `${tot||'?'}${a.unit||(a.type==='run'?'mi':'yd')}`; }
      else t = `${a.duration||'?'}m`;
      out += chip('c-' + a.type, `${e} ${t}`);
    });
    return out;
  }

  // Colour carries the meaning: grey = short, amber = acceptable, green = target hit,
  // red = past the recovery cap. The number after the slash is what you're chasing next.
  function goalChip(g, c) {
    const n = c[g.key] || 0;
    const t = (typeof goalTier === 'function') ? goalTier(g, n)
            : { cls: '', next: (g.floor != null ? g.floor : g.target) };   // tolerate an older app.js
    const ttl = `${g.label}${g.good ? ' \u00b7 aim ' + g.good : ''}${g.cap ? ' \u00b7 cap ' + g.cap : ''}`;
    return `<span class="goal ${t.cls}" title="${ttl}">${g.emoji}<b>${n}</b>${t.next ? `<em>/${t.next}</em>` : ''}</span>`;
  }
  function render() {
    const days = weekDays(offset);
    const isos = days.map(d => d.iso), c = weekCounts(isos);
    const idx = isos.indexOf(today);
    const left = offset === 0 && idx > -1 ? 7 - idx : null;
    const load = (typeof weekLoad === 'function') ? weekLoad(isos).total : 0;

    goals.innerHTML =
      `<div class="goals-h"><span>${offset === 0 ? 'This week' : 'That week'}</span>
         <span class="goals-meta">${load ? load + ' AU' : ''}${load && left !== null ? ' \u00b7 ' : ''}${left !== null ? left + (left === 1 ? ' day left' : ' days left') : ''}</span></div>
       <div class="goalrow">${GOALS.map(g => goalChip(g, c)).join('')}</div>`;
    wklabel.textContent = `${days[0].mon} ${days[0].dom} \u2013 ${days[6].mon} ${days[6].dom}` + (offset === 0 ? '  \u00b7  this week' : '');
    wk.innerHTML = '';
    days.forEach(d => {
      const isToday = d.iso === today;
      const chips = chipsFor(d.iso);
      const el = document.createElement('button');
      el.className = 'wkday' + (isToday ? ' today' : '');
      el.innerHTML =
        `<div class="wkd-date"><span class="wkd-dow">${d.dow}</span><span class="wkd-dom">${d.dom}</span></div>
         <div class="wkd-body">${chips || '<span class="wkd-empty">rest / open</span>'}</div>
         <div class="wkd-caret">\u203a</div>`;
      el.onclick = () => location.href = 'day.html?date=' + d.iso;
      wk.appendChild(el);
    });
  }
  prev.onclick = () => { offset--; render(); };
  next.onclick = () => { offset++; render(); };
  // log out — always confirm. It sits one tap from Backup in the footer, and it
  // wipes this device's local copy, so a mis-tap is expensive.
  out.onclick = async e => {
    e.preventDefault();
    const di = draftInfo();
    const risk = [];
    if (di) risk.push(`an unfinished ${di.label} (${di.sets} set${di.sets===1?'':'s'})`);
    if (Store.pending()) risk.push('changes that haven\u2019t synced yet');
    const msg = risk.length
      ? `Log out?\n\nThis device still has ${risk.join(' and ')}. Logging out clears the local copy — anything that can\u2019t reach the cloud first is lost.`
      : 'Log out?\n\nYour data stays in the cloud. You\u2019ll need your email and password to get back in.';
    if (!confirm(msg)) return;
    out.textContent = 'Logging out\u2026';
    out.style.pointerEvents = 'none';
    await Auth.logout();
  };
  render();
  });
</script>
</body>
</html>
