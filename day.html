<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pentathlon">
<meta name="theme-color" content="#EEF2F7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Pentathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2026.08.12-6">
</head>
<body>
<div class="page">
  <div class="dayhead">
    <a href="index.html" class="back">&lsaquo;</a>
    <div class="dayttl" id="dayttl"></div>
  </div>

  <div id="resume"></div>
  <div id="logged"></div>

  <div class="section-label">Add to this day</div>
  <div class="picker">
    <div class="picklabel"><span>Lift</span><em id="liftHint"></em></div>
    <div class="wpick" id="liftpick">
      <button data-w="w1">W1</button><button data-w="w2">W2</button><button data-w="w3">W3</button>
    </div>
  </div>
  <div class="picker runrow">
    <div class="picklabel"><span>Run</span><em id="runHint"></em></div>
    <div class="wpick" id="runpick"></div>
  </div>
  <div class="addsports" id="addsports"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=2026.08.12-6"></script>
<script>
  boot(async () => {
  const date = new URLSearchParams(location.search).get('date') || todayISO();
  dayttl.textContent = prettyDate(date);

  // logged items
  function renderLogged() {
    const sess = sessionsOn(date), acts = activitiesOn(date);
    if (!sess.length && !acts.length) { logged.innerHTML = '<div class="empty">Nothing logged yet.<br>Add an activity below.</div>'; return; }
    let html = '<div class="actlist">';
    sess.forEach(s => {
      const n = Object.keys(s.exercises || {}).length;
      const semoji = (typeof ATHLETIC_DAYS !== 'undefined' && ATHLETIC_DAYS.includes(s.day)) ? '\u26A1' : '\u{1F3CB}\uFE0F';
      html += `<div class="actrow"><div class="act-emoji">${semoji}</div>
        <div class="act-body"><b>${dayLabel(s.day)}</b><span>${n} exercise${n===1?'':'s'} logged</span></div>
        <button class="act-del" data-sid="${s.id}">\u2715</button></div>`;
    });
    acts.forEach(a => {
      const e = ACT[a.type] ? ACT[a.type].emoji : '\u2022', label = ACT[a.type] ? ACT[a.type].label : a.type;
      html += `<div class="actrow" data-aid="${a.id}"><div class="act-emoji">${e}</div>
        <div class="act-body"><b>${label}</b><span>${activitySummary(a)}${a.note?' \u00b7 '+a.note:''}</span></div>
        <button class="act-del" data-adel="${a.id}">\u2715</button></div>`;
    });
    html += '</div>';
    logged.innerHTML = html;

    logged.querySelectorAll('[data-aid]').forEach(r => r.onclick = ev => {
      if (ev.target.closest('.act-del')) return;
      location.href = `activity.html?id=${r.dataset.aid}&date=${date}`;
    });
    logged.querySelectorAll('[data-adel]').forEach(b => b.onclick = () => {
      if (confirm('Delete this activity?')) { deleteActivity(b.dataset.adel); renderLogged(); }
    });
    logged.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => {
      if (confirm('Delete this logged workout?')) {
        Store.update(s => { s.sessions = s.sessions.filter(x => String(x.id) !== String(b.dataset.sid)); });
        renderLogged();
      }
    });
  }
  renderLogged();

  // resume banner — an in-progress workout is autosaved; surface it
  const di = draftInfo();
  if (di) {
    resume.innerHTML =
      `<a class="resume" href="workout.html?day=${di.day}&date=${di.date}">
         <div class="resume-body"><b>Resume ${di.label}</b><span>${di.sets} set${di.sets===1?'':'s'} saved · ${prettyDate(di.date)}</span></div>
         <span class="resume-caret">›</span></a>`;
  }

  // add lift — the suggested workout is the highlighted chip; the hint names it
  const sugg = nextWorkout();
  liftHint.textContent = `${PROGRAM[sugg].label} next \u00b7 ${PROGRAM[sugg].focus}`;
  document.querySelectorAll('#liftpick button').forEach(b => {
    if (b.dataset.w === sugg) b.classList.add('on');
    b.title = PROGRAM[b.dataset.w].label + ' \u2014 ' + PROGRAM[b.dataset.w].focus;
    b.onclick = () => location.href = `workout.html?day=${b.dataset.w}&date=${date}`;
  });

  // add run — highest-priority unfilled slot this week is highlighted, any is tappable
  {
    const isos = weekDays(0, date).map(d => d.iso);
    const nr = nextRun(isos);
    runHint.textContent = `${nr.label} next \u00b7 ${nr.range}`;
    let keyN = 0;
    runpick.innerHTML = RUN_SLOTS.map(sl => {
      const tpl = sl.rotates ? nextKeyRun() : sl.tpl;
      // the two key slots share a template, so number them — otherwise they're identical chips
      const short = sl.rotates ? (++keyN === 1 ? '\u26a1' : '\u26a1\u00b2')
        : sl.label.replace('Easy + strides','Str').replace('Long easy','Long').replace('Shakeout jog','Shake');
      return `<button data-tpl="${tpl}" data-slot="${sl.k}" class="${sl.k===nr.slot.k?'on':''}" title="${sl.label} \u00b7 ${sl.min}\u2013${sl.max} min">${short}</button>`;
    }).join('');
    runpick.querySelectorAll('button').forEach(b => b.onclick = () =>
      location.href = `activity.html?type=run&date=${date}&tpl=${b.dataset.tpl}&slot=${b.dataset.slot}`);
  }

  // add sports
  addsports.innerHTML = ACT_ORDER.map(t =>
    `<button data-type="${t}">${ACT[t].emoji} ${ACT[t].label}</button>`).join('');
  addsports.querySelectorAll('button').forEach(b => b.onclick = () =>
    location.href = `activity.html?type=${b.dataset.type}&date=${date}`);
  });
</script>
</body>
</html>
